name: Deploy Noodle Bot

# Run by hand (Actions → Deploy Noodle Bot → Run workflow) when main is ready
# to go live. It used to run on every push to main, but the gate it waits on
# never passed, so it never deployed anything; with the gate fixed it would
# have started deploying every push, ready or not.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The same gate as every push and pull request (rust-quality.yml), without
  # the advisory scan: a newly published advisory can fail that with nothing
  # to do with what is being deployed.
  quality:
    uses: ./.github/workflows/rust-quality.yml
    with:
      skip_security: true

  deploy:
    needs: quality
    runs-on: ubuntu-24.04

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}  # Default is 22
          script: |
            # Navigate to the container directory
            cd /home/mok/containers/zgaf-matrix-rust

            rm -rf Chatter

            # Clone the repository
            git clone https://github.com/Chatter-Org/Chatter

            cd Chatter

            cp ../control.sh .

            echo "${{ secrets.SSH_PASSWORD }}" | sudo -S ./control.sh build
            echo "${{ secrets.SSH_PASSWORD }}" | sudo -S ./control.sh stop
            echo "${{ secrets.SSH_PASSWORD }}" | sudo -S ./control.sh start
