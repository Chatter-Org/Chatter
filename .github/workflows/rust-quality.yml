name: Rust Quality Gate

# Pushes to main as well as pull requests: most changes land by pushing to main
# directly, and a gate that only watched pull requests never saw them.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # deploy.yml runs this gate before deploying, without the advisory scan.
  workflow_call:
    inputs:
      skip_security:
        description: Skip the advisory and licence scan
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    # Pinned rather than ubuntu-latest, which moves to a new release on its own.
    runs-on: ubuntu-24.04
    # scripts/rust-ci.sh runs `cargo test --workspace`, and the integration
    # tests in tests/ spawn a real server via build_state(), which connects to
    # MongoDB. Without this service they fail before asserting anything.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The media tests convert real video, as the server does in production
      # (the Dockerfile installs ffmpeg). The runner image has none, so without
      # this every one of them failed and the gate had never passed.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run quality gate
        run: ./scripts/rust-ci.sh

  security:
    name: Security
    # Off when deploying: a newly published advisory can fail it with nothing
    # to do with the change being deployed. It still runs on every push and PR.
    # Phrased as a skip because a push or PR has no inputs at all, and an
    # absent input compares equal to false: `inputs.security != false` skipped
    # this job everywhere but the one place it was meant to run.
    if: ${{ !inputs.skip_security }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install security tooling
        run: |
          cargo install cargo-deny --locked
          cargo install cargo-audit --locked

      - name: Run security checks
        run: ./scripts/rust-security.sh
