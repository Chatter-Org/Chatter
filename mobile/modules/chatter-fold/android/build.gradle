plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'io.zgaf.chatter'
version = '0.1.0'

android {
  namespace "io.zgaf.chatter.fold"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // The hinge and the posture (Jetpack WindowManager's FoldingFeature).
  implementation 'androidx.window:window:1.5.1'
}
