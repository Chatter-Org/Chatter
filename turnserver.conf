# Chatter TURN server configuration
# Update the values below for your environment

# Listen on all interfaces
listening-port=3478

# Your server's public IP address (REQUIRED - change this)
# If behind NAT, use: external-ip=PUBLIC_IP/LAN_IP
# e.g. external-ip=203.0.113.1/192.168.1.100
#external-ip=YOUR_PUBLIC_IP

# Relay port range — forward these UDP ports on your firewall
min-port=49152
max-port=49252

# Credentials (must match TURN_USERNAME/TURN_PASSWORD in docker-compose)
lt-cred-mech
user=chatter:changeme

# Realm
realm=chatter

# Logging
log-file=stdout

# Security
no-multicast-peers
no-cli

# Every signed-in user is handed these credentials, so the relay must not be a
# way into this host's networks. WebRTC only ever relays UDP; a TCP relay
# (RFC 6062) is what a hand-written client would use to reach, say, MongoDB.
no-tcp-relay

# No relaying to private or special-purpose addresses: the LAN, cloud metadata
# (169.254.169.254), carrier-grade NAT. Loopback is refused by coturn already.
# 172.16.0.0/12 is deliberately NOT listed: Docker's networks live there, and
# relayed calls reach the Chatter container on its address in that range.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
